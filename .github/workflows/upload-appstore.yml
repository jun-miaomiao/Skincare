# 手動觸發：Release 包上傳到 App Store Connect（不會自動送審）
name: Upload App Store Connect

on:
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          ls /Applications | grep -i Xcode || true
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          elif [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install Fastlane
        run: |
          bundle install
          bundle exec fastlane --version

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Verify Apple Distribution identity
        run: |
          set -euo pipefail
          echo "== keychains =="
          security list-keychains -d user
          echo "== codesigning identities =="
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -Eq 'Apple Distribution|iPhone Distribution'; then
            echo "::error::BUILD_CERTIFICATE_BASE64 必須是 Apple Distribution（不是 Apple Development）。請從鑰匙圈重新匯出 Distribution 的 .p12 並更新 Secret。"
            exit 1
          fi

      - name: Build & upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane upload_asc
